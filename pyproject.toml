[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-output-schema-enforcer"
version = "0.1.0"
description = "Finite-state machine streaming repair parser that enforces JSON schema validity and repairs truncated LLM payloads"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-output-schema-enforcer = "agent_output_schema_enforcer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_output_schema_enforcer*"]
